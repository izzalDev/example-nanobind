[project]
name = "example-nanobind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "izzalDev", email = "rizal.fadlullah@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[tool.scikit-build]
minimum-version = "build-system.requires"
